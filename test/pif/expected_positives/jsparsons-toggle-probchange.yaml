---
parsed:
  :value:
    exercise_id: https://github.com/CSSPLICE/peml-feasibility-examples/blob/main/parsons/jsparsons-toggle-probchange.peml
    title: Print min value
    license:
      id: MIT
      owner:
        name: Cliff Shaffer
        email: shaffer@vt.edu
    tags:
      topics: PEML Demo Parsons Problem
    settings:
      grader:
        type: execute
      indent:
        active: 'true'
        mode: prescribed
    instructions: 'The constructed code should print the minimum of variables a and
      b.

      '
    systems:
    - language: Python
      assets:
        code:
          blocks:
            delimiter: "\\"
            content:
            - blockid: one1
              display: if \\a\b\c\\ \\<\>\>=\\ b
            - blockid: two
              display: print(a)
            - blockid: three
              display: else
            - blockid: four
              display: print(b)
          wrapper:
            files:
            - content: |
                a = 4
                b = 2
                ___
        test:
          files:
          - format: text/csv-unquoted
            content: |
              expected
              2
  :diagnostics: &1
  - 'Path ''/systems/0/assets/test/files/0'' is missing key: type'
renderable:
  :diagnostics: *1
